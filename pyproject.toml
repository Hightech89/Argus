[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-soc"
version = "0.1.0"
description = "Evidence-driven Security Operations Copilot for Home SOC environments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Josh Cox" }
]
dependencies = [
    "typer>=0.12,<1.0"
]

[project.scripts]
argus = "argus.cli:app"

[tool.setuptools.packages.find]
include = ["argus*"]
